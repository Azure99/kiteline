name: Check and build deliveries

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      full:
        default: false
        type: boolean
      image-artifacts:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Prepare native build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libevent-dev libncurses-dev ncurses-bin bison curl patch
      - name: Check source
        run: |
          set -euo pipefail
          echo "Product: $(git rev-parse HEAD); workflow: $GITHUB_SHA"
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm --filter @kiteline/web build
          pnpm native:build
          pnpm test

  agent:
    needs: checks
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-amd64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ startsWith(matrix.target, 'macos') && 15 || 20 }}
    env:
      TARGET: ${{ matrix.target }}
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Build tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/kiteline-ci
          corepack enable pnpm
          pnpm install --frozen-lockfile
          if [[ "$TARGET" == linux-* ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils libarchive-tools
          fi
      - name: Build the actual package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == macos-* ]]; then
            arch=${TARGET#macos-}
            node scripts/build-macos-components.mjs prepare "$arch" /var/tmp/kiteline-ci/inputs
            node /var/tmp/kiteline-ci/inputs/scripts/build-macos-components.mjs build "$arch" /var/tmp/kiteline-ci/inputs /var/tmp/kiteline-ci/components
            pnpm package agent "$TARGET" --macos-components=/var/tmp/kiteline-ci/components
          else
            pnpm package agent "$TARGET"
          fi
          pnpm package cli "$TARGET"
      - name: Verify and run the packaged agent and CLI
        shell: bash
        env:
          KITELINE_AGENT_HOME: /var/tmp/kiteline-ci/check-state
          KITELINE_AGENT_RUN_DIR: /var/tmp/kiteline-ci/check-run
        run: |
          set -euo pipefail
          version=$(node -p 'require("./packages/shared/src/version.json").version')
          name="kiteline-agent-$version-$TARGET"
          archive="dist/releases/$name.tar.gz"
          tar -xf "$archive" -C /var/tmp/kiteline-ci
          package="/var/tmp/kiteline-ci/$name"
          node scripts/verify-package.mjs agent "$TARGET" "$archive" "$package"
          test "$("$package/bin/kiteline-agent" --version)" = "$version"
          "$package/bin/kiteline-agent" check
          test "$("$package/bin/kiteline" --version)" = "$version"
          "$package/bin/kiteline" --help
          name="kiteline-cli-$version-$TARGET"
          archive="dist/releases/$name.tar.gz"
          tar -xf "$archive" -C /var/tmp/kiteline-ci
          package="/var/tmp/kiteline-ci/$name"
          node scripts/verify-package.mjs cli "$TARGET" "$archive" "$package"
          test "$("$package/bin/kiteline" --version)" = "$version"
          "$package/bin/kiteline" --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-agent-${{ matrix.target }}
          overwrite: true
          path: dist/releases/*.tar.gz*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows-msys:
    needs: checks
    if: inputs.full
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Prepare fixed inputs and build MSYS components
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'kiteline-ci'
          New-Item -ItemType Directory $root | Out-Null
          node scripts/build-windows-components.mjs prepare "$root/inputs"
          node "$root/inputs/scripts/build-windows-components.mjs" tmux "$root/inputs" "$root/msys"
          $archive = Join-Path $env:RUNNER_TEMP 'windows-inputs.tar'
          & "$env:SystemRoot/System32/tar.exe" -cf $archive -C $root inputs msys
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-inputs
          overwrite: true
          path: ${{ runner.temp }}/windows-inputs.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows-package:
    needs: windows-msys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-inputs
          path: /var/tmp/kiteline-ci-transfer
      - name: Addon, components and final ZIP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libarchive-tools unzip zip zstd
          mkdir /var/tmp/kiteline-ci
          tar -xf /var/tmp/kiteline-ci-transfer/windows-inputs.tar -C /var/tmp/kiteline-ci
          node scripts/build-windows-components.mjs addon /var/tmp/kiteline-ci/inputs /var/tmp/kiteline-ci/addon
          node scripts/build-windows-components.mjs assemble /var/tmp/kiteline-ci/inputs /var/tmp/kiteline-ci/msys /var/tmp/kiteline-ci/addon /var/tmp/kiteline-ci/components
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm package agent windows-amd64 --windows-components=/var/tmp/kiteline-ci/components
          pnpm package cli windows-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-agent-windows-amd64
          overwrite: true
          path: dist/releases/*.zip*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows-accept:
    needs: windows-package
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: delivery-agent-windows-amd64
          path: dist/releases
      - name: Verify and run the actual ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -Raw packages/shared/src/version.json | ConvertFrom-Json).version
          $name = "kiteline-agent-$version-windows-amd64"
          $archive = "dist/releases/$name.zip"
          $root = Join-Path $env:RUNNER_TEMP 'kiteline-ci'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $package = Join-Path $root $name
          node scripts/verify-package.mjs agent windows-amd64 $archive $package
          $drive = [System.IO.Path]::GetPathRoot($root)
          $env:KITELINE_AGENT_HOME = Join-Path $drive 'kiteline-ci-check-state'
          $env:KITELINE_AGENT_RUN_DIR = Join-Path $drive 'kiteline-ci-check-run'
          $actual = & pwsh -NoProfile -ExecutionPolicy Bypass -File "$package/bin/kiteline-agent.ps1" --version
          if ($actual -ne $version) { throw "Version mismatch: $actual" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File "$package/bin/kiteline-agent.ps1" check
          $agentPackage = $package
          $name = "kiteline-cli-$version-windows-amd64"
          $archive = "dist/releases/$name.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $package = Join-Path $root $name
          node scripts/verify-package.mjs cli windows-amd64 $archive $package
          foreach ($directory in @($agentPackage, $package)) {
            foreach ($hostName in @('powershell.exe', 'pwsh')) {
              $actual = & $hostName -NoProfile -ExecutionPolicy Bypass -File "$directory/bin/kiteline.ps1" --version
              if ($LASTEXITCODE -ne 0 -or $actual -ne $version) { throw "CLI version mismatch: $actual" }
              & $hostName -NoProfile -ExecutionPolicy Bypass -File "$directory/bin/kiteline.ps1" --help
              if ($LASTEXITCODE -ne 0) { throw "CLI help failed: $hostName" }
            }
          }

  server:
    needs: [agent, windows-package, windows-accept]
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: delivery-agent-*
          path: dist/releases
          merge-multiple: true
      - name: Build tools and dependencies
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/kiteline-ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
          corepack enable pnpm
          pnpm install --frozen-lockfile
          version=$(node -p 'require("./packages/shared/src/version.json").version')
          server="kiteline-server-$version-linux-$ARCH"
          agent="kiteline-agent-$version-linux-amd64"
          {
            echo "SERVER_NAME=$server"
            echo "SERVER_ARCHIVE=$server.tar.gz"
            echo "SERVER_IMAGE=kiteline-server:$version-$ARCH"
            echo "SERVER_IMAGE_ARCHIVE=kiteline-server-$version-$ARCH.tar"
            echo "AGENT_NAME=$agent"
            echo "AGENT_ARCHIVE=$agent.tar.gz"
          } >> "$GITHUB_ENV"
      - name: Build and verify the server package
        run: |
          set -euo pipefail
          pnpm package server "$ARCH"
          tar -xf "dist/releases/$SERVER_ARCHIVE" -C /var/tmp/kiteline-ci
          package="/var/tmp/kiteline-ci/$SERVER_NAME"
          node scripts/verify-package.mjs server "linux-$ARCH" "dist/releases/$SERVER_ARCHIVE" "$package"
          terminal=()
          if [[ "$ARCH" == amd64 ]]; then
            tar -xf "dist/releases/$AGENT_ARCHIVE" -C /var/tmp/kiteline-ci
            terminal=(--agent="/var/tmp/kiteline-ci/$AGENT_NAME")
          fi
          node scripts/verify-server.mjs "$package" /var/tmp/kiteline-ci/server-check "${terminal[@]}"
      - name: Build and verify the actual image
        run: |
          set -euo pipefail
          pnpm images "$ARCH"
          node scripts/verify-server.mjs "/var/tmp/kiteline-ci/$SERVER_NAME" /var/tmp/kiteline-ci/image-check --image="$SERVER_IMAGE"
      - name: Export verified image for transfer
        if: inputs.image-artifacts
        run: |
          set -euo pipefail
          docker save --output "dist/releases/$SERVER_IMAGE_ARCHIVE" "$SERVER_IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-server-${{ matrix.arch }}
          overwrite: true
          path: |
            dist/releases/kiteline-server-*.tar.gz*
            dist/releases/kiteline-server-*.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-diagnostics-${{ matrix.arch }}
          overwrite: true
          path: |
            /var/tmp/kiteline-ci/server-check/*.log
            /var/tmp/kiteline-ci/image-check/*.log
          retention-days: 1
          if-no-files-found: ignore
