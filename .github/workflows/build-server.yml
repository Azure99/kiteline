name: Build server and image

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      image-artifacts:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ inputs.arch }}
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: delivery-agent-*
          path: dist/releases
          merge-multiple: true
      - name: Build tools and dependencies
        run: |
          set -euo pipefail
          mkdir -p /var/tmp/kiteline-ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
          corepack enable pnpm
          pnpm install --frozen-lockfile
          echo "VERSION=$(node -p 'require("./shared/src/version.json").version')" >> "$GITHUB_ENV"
      - name: Build and verify the server package
        run: |
          set -euo pipefail
          pnpm package server "$ARCH"
          name="kiteline-server-$VERSION-linux-$ARCH"
          tar -xf "dist/releases/$name.tar.gz" -C /var/tmp/kiteline-ci
          package="/var/tmp/kiteline-ci/$name"
          node scripts/verify-package.mjs server "linux-$ARCH" "dist/releases/$name.tar.gz" "$package"
          terminal=()
          if [[ "$ARCH" == amd64 ]]; then
            agent="kiteline-agent-$VERSION-linux-amd64"
            tar -xf "dist/releases/$agent.tar.gz" -C /var/tmp/kiteline-ci
            terminal=(--agent="/var/tmp/kiteline-ci/$agent")
          fi
          node scripts/verify-server.mjs "$package" /var/tmp/kiteline-ci/server-check "${terminal[@]}"
      - name: Build and verify the actual image
        run: |
          set -euo pipefail
          pnpm images "$ARCH"
          node scripts/verify-server.mjs "/var/tmp/kiteline-ci/kiteline-server-$VERSION-linux-$ARCH" /var/tmp/kiteline-ci/image-check --image="kiteline-server:$VERSION-$ARCH"
      - name: Export verified image for transfer
        if: inputs.image-artifacts
        run: |
          set -euo pipefail
          name="kiteline-server-$VERSION-$ARCH.tar"
          docker save --output "dist/releases/$name" "kiteline-server:$VERSION-$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-server-${{ inputs.arch }}
          overwrite: true
          path: |
            dist/releases/kiteline-server-*.tar.gz*
            dist/releases/kiteline-server-*.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-diagnostics-${{ inputs.arch }}
          overwrite: true
          path: |
            /var/tmp/kiteline-ci/server-check/*.log
            /var/tmp/kiteline-ci/image-check/*.log
          retention-days: 1
          if-no-files-found: ignore
