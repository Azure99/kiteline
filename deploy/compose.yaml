name: kiteline
services:
  server:
    image: kiteline-server:${KITELINE_VERSION:-0.1.0}-${KITELINE_ARCH:-amd64}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      KITELINE_PUBLIC_URL: ${KITELINE_PUBLIC_URL:?Set KITELINE_PUBLIC_URL to your final HTTPS origin}
    ports:
      - "${KITELINE_HTTP_BIND:-127.0.0.1}:${KITELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/kiteline
volumes:
  server-data:
