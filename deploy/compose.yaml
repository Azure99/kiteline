name: kiteline
services:
  server:
    image: ${KITELINE_IMAGE:-ghcr.io/azure99/kiteline}:${KITELINE_VERSION:?Set KITELINE_VERSION to the release version}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      KITELINE_TRUST_PROXY_PROTO: "${KITELINE_TRUST_PROXY_PROTO:-0}"
    ports:
      - "${KITELINE_HTTP_BIND:-127.0.0.1}:${KITELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/kiteline
volumes:
  server-data:
